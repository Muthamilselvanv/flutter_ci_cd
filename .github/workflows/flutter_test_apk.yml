name: Build Testing APK

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment for the testing APK
        required: true
        default: development
        type: choice
        options:
          - development
          - staging
      build_mode:
        description: Debug is faster; release is closer to production
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

concurrency:
  group: testing-apk-${{ inputs.environment }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.5'
  MIN_LINE_COVERAGE: '50'

jobs:
  validate:
    name: Validate source before testing build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze project
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage --reporter expanded

      - name: Enforce minimum line coverage
        run: dart run tool/check_coverage.dart ${{ env.MIN_LINE_COVERAGE }}

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  build:
    name: Build ${{ inputs.environment }} ${{ inputs.build_mode }} APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ${{ inputs.environment }}

    env:
      APP_ENV: ${{ inputs.environment }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve version and flavor
        id: config
        shell: bash
        run: |
          if [[ -z "$API_BASE_URL" || -z "$WEB_BASE_URL" ]]; then
            echo "API_BASE_URL and WEB_BASE_URL are required in the '$APP_ENV' GitHub Environment."
            exit 1
          fi

          case "$APP_ENV" in
            development) flavor="dev" ;;
            staging) flavor="staging" ;;
            *) echo "Unsupported testing environment: $APP_ENV"; exit 1 ;;
          esac

          version="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          if [[ -z "$version" ]]; then
            echo "Unable to read version from pubspec.yaml."
            exit 1
          fi

          echo "flavor=$flavor" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build testing APK
        run: >
          flutter build apk
          --${{ inputs.build_mode }}
          --flavor ${{ steps.config.outputs.flavor }}
          --dart-define=APP_ENV=${{ env.APP_ENV }}
          --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
          --dart-define=WEB_BASE_URL=${{ env.WEB_BASE_URL }}

      - name: Create versioned artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "build/app/outputs/flutter-apk/app-${{ steps.config.outputs.flavor }}-${{ inputs.build_mode }}.apk" \
            "dist/app-${{ inputs.environment }}-v${{ steps.config.outputs.version }}-${{ inputs.build_mode }}.apk"

      - name: Upload testing APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flutter-${{ inputs.environment }}-v${{ steps.config.outputs.version }}-${{ inputs.build_mode }}-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
