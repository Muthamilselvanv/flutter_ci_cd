name: Flutter CI/CD name

on:
  # Pull requests get quality checks, but ordinary commits do not build apps.
  pull_request:
    branches:
      - main
      - develop
      - staging

  # A version tag is an explicit production release request.
  push:
    tags:
      - 'v*'

  # GitHub Actions -> Flutter CI/CD -> Run workflow.
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to build
        required: true
        default: development
        type: choice
        options:
          - development
          - staging
          - production

permissions:
  contents: read

jobs:
  quality:
    name: Test and analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check code formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build:
    name: Build ${{ github.event_name == 'push' && 'production' || inputs.environment }}
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-latest

    # Create these GitHub Environments and add API_BASE_URL and WEB_BASE_URL
    # variables to each one. Production can require reviewer approval.
    environment: ${{ github.event_name == 'push' && 'production' || inputs.environment }}

    env:
      APP_ENV: ${{ github.event_name == 'push' && 'production' || inputs.environment }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate variables and select flavor
        shell: bash
        run: |
          if [[ -z "$API_BASE_URL" || -z "$WEB_BASE_URL" ]]; then
            echo "API_BASE_URL and WEB_BASE_URL must be configured in the '$APP_ENV' GitHub Environment."
            exit 1
          fi

          case "$APP_ENV" in
            development)
              echo "FLAVOR=dev" >> "$GITHUB_ENV"
              ;;
            staging)
              echo "FLAVOR=staging" >> "$GITHUB_ENV"
              ;;
            production)
              echo "FLAVOR=production" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported environment: $APP_ENV"
              exit 1
              ;;
          esac

      - name: Build development or staging APK
        if: env.FLAVOR != 'production'
        run: >
          flutter build apk
          --release
          --flavor ${{ env.FLAVOR }}
          --dart-define=APP_ENV=${{ env.APP_ENV }}
          --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
          --dart-define=WEB_BASE_URL=${{ env.WEB_BASE_URL }}

      - name: Upload APK
        if: env.FLAVOR != 'production'
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ env.FLAVOR }}-release-apk
          path: build/app/outputs/flutter-apk/app-${{ env.FLAVOR }}-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build production AAB
        if: env.FLAVOR == 'production'
        run: >
          flutter build appbundle
          --release
          --flavor production
          --dart-define=APP_ENV=${{ env.APP_ENV }}
          --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
          --dart-define=WEB_BASE_URL=${{ env.WEB_BASE_URL }}

      - name: Upload production AAB
        if: env.FLAVOR == 'production'
        uses: actions/upload-artifact@v4
        with:
          name: flutter-production-release-aab
          path: build/app/outputs/bundle/productionRelease/app-production-release.aab
          if-no-files-found: error
          retention-days: 30
